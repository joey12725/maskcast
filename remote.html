<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Remote Avatar</title>
</head>
<body>
<video id="local" autoplay playsinline muted style="width:45%"></video>
<video id="remote" autoplay playsinline style="width:45%"></video>
<script>
async function init(){
  const pc = new RTCPeerConnection();
  const localVideo = document.getElementById('local');
  const remoteVideo = document.getElementById('remote');
  pc.ontrack = (ev)=>{ remoteVideo.srcObject = ev.streams[0]; };
  const stream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  localVideo.srcObject = stream;
  stream.getTracks().forEach(t=>pc.addTrack(t, stream));
  pc.ondatachannel = (ev)=>{
    const dc = ev.channel;
    dc.onmessage = (msg)=>{
      if(typeof msg.data === 'string' && msg.data.startsWith('ping:')){
        dc.send('pong:'+msg.data.slice(5));
      }
    };
  };
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  const params = new URLSearchParams(window.location.search);
  let server = params.get('server');
  if (!server) {
    server = location.protocol === 'file:' ? 'http://localhost:8080' : '';
  }
  server = server.replace(/\/$/, '');
  const resp = await fetch(`${server}/offer`, {method:'POST', headers:{'Content-Type':'application/sdp'}, body: offer.sdp});
  const answer = await resp.text();
  await pc.setRemoteDescription({type:'answer', sdp:answer});
}
init();
</script>
</body>
</html>
